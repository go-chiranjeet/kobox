[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobox"
version = "0.1.0"
description = "One voice from two engines: Kokoro's speed with Chatterbox's real laughs, sighs and moods, checked by Whisper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "kokoro-onnx>=0.6", "sounddevice>=0.5", "pywhispercpp>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["kobox"]

[tool.setuptools.package-data]
kobox = ["voices/*.wav"]
