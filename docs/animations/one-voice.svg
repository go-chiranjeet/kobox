<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Chatterbox's raw laugh line is about 8 dB quieter than Kokoro, brighter, and starts late. Kobox trims the lead silence, pulls the tone toward Kokoro, matches the speech level and applies a speaker-safe limit, so the two engines sound like one voice.">
<style>
svg{--ink:#1f2328;--dim:#59636e;--line:#c9d1d9;--card:#f6f8fa;--kk:#0a8a7a;--cb:#d1336b;--on:#fff}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--dim:#9198a1;--line:#3d444d;--card:#161b22;--kk:#3ccab4;--cb:#ff6b9a;--on:#0d1117}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:var(--dim)}
.kk{fill:var(--kk)}.cb{fill:var(--cb)}.spk{stroke:var(--cb);stroke-width:1.2;opacity:.8}
.band{stroke:var(--line);stroke-dasharray:5 4}
.chip rect{fill:var(--card);stroke:var(--line)}.chip text{font-size:12.5px;font-weight:600}
@keyframes trim{0%,18%{transform:translateX(560px)}30%,100%{transform:translateX(500px)}}
@keyframes lvl{0%,58%{transform:scaleY(.42)}72%,100%{transform:scaleY(1)}}
@keyframes eq{0%,40%{opacity:1}52%,100%{opacity:0}}
@keyframes d1{0%,62%{opacity:1}68%,100%{opacity:0}}@keyframes d2{0%,62%{opacity:0}68%,100%{opacity:1}}
@keyframes on1{0%,18%{opacity:.35}20%,38%{opacity:1}40%,100%{opacity:.35}}
@keyframes on2{0%,38%{opacity:.35}40%,58%{opacity:1}60%,100%{opacity:.35}}
@keyframes on3{0%,58%{opacity:.35}60%,78%{opacity:1}80%,100%{opacity:.35}}
@keyframes on4{0%,78%{opacity:.35}80%,100%{opacity:1}}
@keyframes done{0%,80%{opacity:0}84%,100%{opacity:1}}
.trim{animation:trim 10s infinite}.lvl{transform-box:view-box;transform-origin:0 170px;animation:lvl 10s infinite}
.eq{animation:eq 10s infinite}.d1{animation:d1 10s infinite}.d2{animation:d2 10s infinite}
.o1{animation:on1 10s infinite}.o2{animation:on2 10s infinite}.o3{animation:on3 10s infinite}.o4{animation:on4 10s infinite}
.done{animation:done 10s infinite}
</style>
