name: tests
on: [push, pull_request]
permissions:
  contents: read          # this workflow can never write to the repo
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4, pinned
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, pinned
        with: { python-version: "3.12" }
      - run: pip install numpy pytest
      - run: python -m pytest -q tests   # no models or audio device needed
